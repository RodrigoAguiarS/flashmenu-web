<section class="resultado cartao-sistema">
  <nz-result
    nzStatus="success"
    nzTitle="Pedido realizado com sucesso."
    [nzSubTitle]="pedido ? 'Pedido #' + pedido.id + ' - status ' + pedido.status : 'Seu pedido foi criado.'"
  >
    <div nz-result-extra>
      <a nz-button nzType="primary" [routerLink]="carrinhoService.cardapioLink()">Continuar comprando</a>
    </div>
  </nz-result>

  @if (pedido) {
    <section class="detalhes-pedido" aria-label="Resumo do pedido">
      <div class="detalhe-topo">
        <div>
          <span>Forma de pagamento</span>
          <strong>{{ pedido.formaPagamento.nome }}</strong>
        </div>
      </div>

      <app-pedido-resumo-financeiro
        [resumo]="pedido"
        [rotuloTotal]="pedido.pagamento ? 'Total pago' : 'Total do pedido'"
      />

      @if (!pedido.pagamento) {
        <div class="linha-pagamento">
          <span>Pagamento</span>
          <strong>Pendente</strong>
        </div>
      }
    </section>
  }
</section>
