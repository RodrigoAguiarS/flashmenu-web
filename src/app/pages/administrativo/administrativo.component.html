<app-page-header
  titulo="Administrativo"
  descricao="Ferramentas para operar e configurar sua unidade."
/>

@if (possuiAtalhos()) {
  <main class="administrativo-layout" aria-label="Area administrativa">
    @for (grupo of grupos(); track grupo.id) {
      <section class="grupo-admin" [attr.aria-labelledby]="'grupo-admin-' + grupo.id">
        <header class="grupo-admin__topo">
          <h2 [id]="'grupo-admin-' + grupo.id">{{ grupo.titulo }}</h2>
          <p>{{ grupo.descricao }}</p>
        </header>

        <div class="atalhos-admin" [class.atalhos-admin--principais]="grupo.id === 'operacao'">
          @for (atalho of grupo.itens; track atalho.id) {
            <a
              class="atalho-admin"
              [class.atalho-admin--principal]="atalho.destaque === 'principal'"
              [routerLink]="atalho.route"
              [attr.aria-label]="atalho.label + ': ' + atalho.descricao"
            >
              <span class="atalho-admin__icone" nz-icon [nzType]="atalho.icon" nzTheme="outline"></span>

              <span class="atalho-admin__conteudo">
                <strong>{{ atalho.label }}</strong>
                <small>{{ atalho.descricao }}</small>
              </span>

              <span class="atalho-admin__seta" nz-icon nzType="arrow-right" nzTheme="outline"></span>
            </a>
          }
        </div>
      </section>
    }
  </main>
} @else {
  <section class="estado-vazio cartao-sistema">
    <nz-empty nzNotFoundContent="Nenhum atalho administrativo liberado."></nz-empty>
  </section>
}
