<app-page-header
  titulo="Administrativo"
  descricao="Acesse as rotinas de gestao liberadas para o seu perfil."
/>

@if (atalhos().length) {
  <section class="atalhos-admin" aria-label="Atalhos administrativos">
    @for (atalho of atalhos(); track atalho.id) {
      <a class="atalho-admin" [routerLink]="atalho.route">
        <span class="atalho-admin__icone" nz-icon [nzType]="atalho.icon" nzTheme="outline"></span>

        <span class="atalho-admin__conteudo">
          <strong>{{ atalho.label }}</strong>
          <small>{{ atalho.route }}</small>
        </span>

        <span class="atalho-admin__seta" nz-icon nzType="arrow-left" nzTheme="outline"></span>
      </a>
    }
  </section>
} @else {
  <section class="estado-vazio cartao-sistema">
    <nz-empty nzNotFoundContent="Nenhum atalho administrativo liberado."></nz-empty>
  </section>
}
