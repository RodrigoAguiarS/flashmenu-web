@if (rotaSemLayout()) {
  <router-outlet />
} @else {
  <nz-layout class="estrutura-app">
    <nz-header class="cabecalho-app">
      <a class="marca marca-app" [routerLink]="linkLojaUnidade()" [attr.aria-label]="nomeHeader()">
        @if (logoHeader(); as logo) {
          <img class="marca-logo" [src]="logo" [alt]="nomeHeader()" />
        } @else {
          <span class="marca-simbolo simbolo-app">{{ inicialHeader() }}</span>
        }

        <span class="marca-texto">
          <strong>{{ nomeHeader() }}</strong>
          <small>{{ subtituloHeader() }}</small>
        </span>
      </a>

      <div class="acoes-cabecalho">
        <app-theme-toggle />
      </div>
    </nz-header>

    <nz-content class="conteudo-app">
      <router-outlet />
    </nz-content>

    <nz-footer class="rodape-app">
      <nav class="navegacao-principal" aria-label="Navegacao principal">
        @for (item of itensNavegacao(); track item.id) {
          <a
            class="nav-link"
            [routerLink]="linkNavegacao(item)"
            routerLinkActive="ativo"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          >
            @if (item.id === 'carrinho') {
              <nz-badge [nzCount]="carrinhoService.quantidadeTotal()" [nzShowZero]="false">
                <span nz-icon [nzType]="item.icon" nzTheme="outline"></span>
              </nz-badge>
            } @else {
              <span nz-icon [nzType]="item.icon" nzTheme="outline"></span>
            }
            <span class="nav-link__label">{{ item.label }}</span>
          </a>
        }
      </nav>
    </nz-footer>
  </nz-layout>
}
