@if (rotaSemLayout()) {
  <router-outlet />
} @else {
  <nz-layout class="estrutura-app">
    <nz-header class="cabecalho-app">
      <a class="marca marca-app" routerLink="/catalogo" aria-label="FlashMenu">
        <span class="marca-simbolo simbolo-app">F</span>
        <span>FlashMenu</span>
      </a>

      <div class="acoes-cabecalho">
        <app-theme-toggle />

        @if (authService.usuarioAutenticado()) {
          <button
            class="acao-icone"
            nz-button
            nzShape="circle"
            type="button"
            nz-tooltip
            nzTooltipTitle="Sair"
            aria-label="Sair"
            (click)="sair()"
          >
            <span nz-icon nzType="logout" nzTheme="outline"></span>
          </button>

        } @else {
          <a
            class="acao-icone"
            nz-button
            nzType="primary"
            nzShape="circle"
            routerLink="/login"
            nz-tooltip
            nzTooltipTitle="Entrar"
            aria-label="Entrar"
          >
            <span nz-icon nzType="login" nzTheme="outline"></span>
          </a>
        }
      </div>
    </nz-header>

    <nz-content class="conteudo-app">
      <router-outlet />
    </nz-content>

    <nz-footer class="rodape-app">
      <nav class="navegacao-principal" aria-label="Navegacao principal">
        @for (item of itensNavegacao(); track item.id) {
          <a
            class="nav-link"
            [routerLink]="item.route"
            routerLinkActive="ativo"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          >
            @if (item.id === 'carrinho') {
              <nz-badge [nzCount]="carrinhoService.quantidadeTotal()" [nzShowZero]="false">
                <span nz-icon [nzType]="item.icon" nzTheme="outline"></span>
              </nz-badge>
            } @else {
              <span nz-icon [nzType]="item.icon" nzTheme="outline"></span>
            }
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    </nz-footer>
  </nz-layout>
}
